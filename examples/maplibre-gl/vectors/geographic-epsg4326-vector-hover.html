<html>

<head>
  <title>GIBS MapLibre GL JS Vector interaction Example</title>

  <link href='https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css' rel='stylesheet' />
  <link rel='stylesheet' href='../example.css' />
  <meta charset='UTF-8'>
  <style>
    #info {
      z-index: 1;
      opacity: 0;
      position: absolute;
      bottom: 0;
      left: 0;
      margin: 0;
      background: rgba(0,60,136,0.7);
      color: white;
      border: 0;
      transition: opacity 100ms ease-in;
    }
  </style>

  <script type='module' src='geographic-epsg4326-vector-hover.js'></script>
</head>

<body>
  <div id='map'></div>
  <pre id='info'></pre>
  <div id='attribution'>
    <a href='https://maplibre.org'>MapLibre</a>
    <a href='https://earthdata.nasa.gov/gibs'>NASA ESDIS GIBS</a>
    <a href='https://github.com/nasa-gibs/gibs-web-examples/blob/main/examples/maplibre-gl/vectors/geographic-epsg4326-vector-hover.js'>
      View Source
    </a>
  </div>
</body>

</html>
